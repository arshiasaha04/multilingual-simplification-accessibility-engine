<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f2">
    <title>ClearWords | Accessible language tools</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17241d; background: #f5f7f2; }
      body { max-width: 760px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.6; }
      main { background: white; border: 1px solid #dce5dc; border-radius: 1rem; padding: clamp(1.25rem, 5vw, 2.5rem); }
      h1 { line-height: 1.2; }
      label { display: block; font-weight: 650; margin: 1rem 0 .35rem; }
      textarea, select, button { font: inherit; }
      textarea, select { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #809487; border-radius: .5rem; }
      textarea { min-height: 12rem; resize: vertical; }
      button { margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: .5rem; color: white; background: #175c3b; cursor: pointer; }
      button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #e29b26; outline-offset: 2px; }
      [role="status"] { min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Make information easier to understand</h1>
      <p>Choose a language and enter text to prepare it for a simpler, more accessible version.</p>
      <form id="simplify-form">
        <label for="language">Language</label>
        <select id="language" name="language" required>
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="bn">Bengali</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
          <option value="mr">Marathi</option>
          <option value="gu">Gujarati</option>
          <option value="kn">Kannada</option>
          <option value="ml">Malayalam</option>
          <option value="pa">Punjabi</option>
          <option value="ur">Urdu</option>
        </select>
        <label for="source-text">Text to simplify</label>
        <textarea id="source-text" name="text" required aria-describedby="help"></textarea>
        <p id="help">Avoid entering personal or sensitive information.</p>
        <button type="submit">Simplify text</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="result" aria-labelledby="result-heading" hidden>
        <h2 id="result-heading">Simplified text</h2>
        <p id="result-text"></p>
      </section>
    </main>
    <script>
      const form = document.querySelector("#simplify-form");
      const status = document.querySelector("#status");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "Processing…";
        document.querySelector("#result").hidden = true;
        try {
          const response = await fetch("/api/simplify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: form.elements.text.value,
              language: form.elements.language.value
            })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || "Request failed.");
          document.querySelector("#result-text").textContent = payload.simplified_text;
          document.querySelector("#result").hidden = false;
          status.textContent = "Text simplified.";
        } catch (error) {
          status.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
